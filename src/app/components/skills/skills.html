<section id="skills" class="skills">
  <div class="container">
    <h2 class="section-title">Habilidades</h2>
    <p class="section-subtitle">Tecnologias e ferramentas que domino</p>

    <div class="skills-grid">
      @for (category of skillCategories; track category.pk_category) {
        <div class="skill-category">
          <h3 class="category-title">{{ category.name }}</h3>
          <div class="skill-items">
            @for (skill of category.skills; track skill.pk_skill) {
              <div class="skill-item">
                <div class="skill-info">
                  <span class="skill-name">{{ skill.name }}</span>
                  <span class="skill-percent">{{ skill.percentage }}%</span>
                </div>
                <div class="skill-bar">
                  <div class="skill-progress" [style.width.%]="skill.percentage"></div>
                </div>
              </div>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
