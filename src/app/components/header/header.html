<header class="header" [class.scrolled]="isScrolled">
  <div class="header-container">
    <a href="#home" class="logo">
      <span class="logo-accent">V</span>itória<span class="logo-dot">.</span>
    </a>

    <nav class="nav" [class.nav-open]="menuOpen">
      <a href="#home" class="nav-link" (click)="closeMenu()">Início</a>
      <a href="#about" class="nav-link" (click)="closeMenu()">Sobre</a>
      <a href="#skills" class="nav-link" (click)="closeMenu()">Habilidades</a>
      <a href="#projects" class="nav-link" (click)="closeMenu()">Projetos</a>
      <a href="#contact" class="nav-link" (click)="closeMenu()">Contato</a>
    </nav>

    <button class="menu-toggle" (click)="toggleMenu()" [attr.aria-label]="menuOpen ? 'Fechar menu' : 'Abrir menu'">
      <span class="bar" [class.open]="menuOpen"></span>
      <span class="bar" [class.open]="menuOpen"></span>
      <span class="bar" [class.open]="menuOpen"></span>
    </button>
  </div>
</header>
